name: Build JIJIEFPVH743 Copter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          path: ardupilot
          submodules: recursive
          fetch-depth: 0

      - name: Copy custom board
        run: |
          mkdir -p ardupilot/libraries/AP_HAL_ChibiOS/hwdef/JIJIEFPVH743
          cp hwdef.dat ardupilot/libraries/AP_HAL_ChibiOS/hwdef/JIJIEFPVH743/
          cp hwdef-bl.dat ardupilot/libraries/AP_HAL_ChibiOS/hwdef/JIJIEFPVH743/

      - name: Install dependencies
        run: |
          cd ardupilot
          Tools/environment_install/install-prereqs-ubuntu.sh -y
          source ~/.profile || true

      - name: Configure and build
        run: |
          cd ardupilot
          ./waf configure --board JIJIEFPVH743
          ./waf copter

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: JIJIEFPVH743-Copter
          path: |
            ardupilot/build/JIJIEFPVH743/bin/arducopter_with_bl.hex
            ardupilot/build/JIJIEFPVH743/bin/arducopter.apj
