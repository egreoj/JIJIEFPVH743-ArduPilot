name: Build JIJIEFPVH743 Copter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          path: ardupilot
          submodules: recursive
          fetch-depth: 0

      - name: Copy custom board
        run: |
          mkdir -p ardupilot/libraries/AP_HAL_ChibiOS/hwdef/JIJIEFPVH743
          cp hwdef/JIJIEFPVH743/hwdef.dat ardupilot/libraries/AP_HAL_ChibiOS/hwdef/JIJIEFPVH743/
          cp hwdef/JIJIEFPVH743/hwdef-bl.dat ardupilot/libraries/AP_HAL_ChibiOS/hwdef/JIJIEFPVH743/
          
          # Register the custom board ID
          echo "AP_HW_JIJIEFPVH743 1043" >> ardupilot/Tools/AP_Bootloader/board_types.txt
          
      - name: Install dependencies
        run: |
          cd ardupilot
          Tools/environment_install/install-prereqs-ubuntu.sh -y
          echo "$HOME/gcc-arm-none-eabi-10-2020-q4-major/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure and build
        run: |
          cd ardupilot
          source ~/.profile || true
          export PATH=$HOME/gcc-arm-none-eabi-10-2020-q4-major/bin:$PATH
          ./waf configure --board JIJIEFPVH743
          ./waf copter

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: JIJIEFPVH743-Copter
          path: |
            ardupilot/build/JIJIEFPVH743/bin/arducopter_with_bl.hex
            ardupilot/build/JIJIEFPVH743/bin/arducopter.apj
